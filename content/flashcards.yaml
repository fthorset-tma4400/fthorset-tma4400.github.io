cards:
  # >>> AGENT A
  - { front: "Hvilke tre radoperasjoner endrer ikke løsningsmengden?", back: "Bytte om to rader, gange en rad med et tall $\\neq 0$, og legge et multiplum av en rad til en annen rad.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Hva kreves for at en matrise er på trappeform?", back: "Nullrader nederst, hver annen rad starter med pivotelementet $1$, og pivotelementene danner en trapp nedover mot høyre.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Hva er forskjellen på trappeform og redusert trappeform?", back: "Redusert trappeform har i tillegg bare nuller over hvert pivotelement, ikke bare under.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Når har et lineært system ingen løsning?", back: "Når radreduksjon gir en rad $[0\\;\\cdots\\;0 \\mid c]$ med $c \\neq 0$, altså $0 = c$.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Når har et lineært system nøyaktig én løsning?", back: "Når systemet ikke er selvmotsigende og hver søyle i koeffisientmatrisen får et pivotelement.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Hva er en fri parameter, og hva er løsningsmengdens dimensjon?", back: "En ukjent i en søyle uten pivotelement. Dimensjonen er antallet frie parametre.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Hvorfor har et homogent system alltid minst én løsning?", back: "Alle høyresidene er null, så $x_1 = \\cdots = x_n = 0$ er alltid en løsning (den trivielle).", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Hvor mange løsninger kan et system med færre ligninger enn ukjente ha?", back: "Ingen eller uendelig mange. Ikke alle søylene kan få pivotelement.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Hva betyr hver lineær ligning i $x, y, z$ geometrisk, og hvordan kan tre slike møtes?", back: "Et plan. Tre plan kan møtes i ett punkt, langs en linje, falle sammen (et plan) eller ikke ha noe felles punkt.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Definisjon: $\\mathbf v_1, \\dots, \\mathbf v_k$ er lineært uavhengige når …", back: "$c_1\\mathbf v_1 + \\cdots + c_k\\mathbf v_k = \\mathbf 0$ bare har løsningen $c_1 = \\cdots = c_k = 0$.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "To snarveier som viser at en mengde vektorer i $\\mathbb R^n$ er lineært avhengig?", back: "Mengden inneholder nullvektoren, eller den har flere enn $n$ vektorer.", section: "Lineære ligningssystemer og Gauss-eliminasjon" }
  - { front: "Når er produktet $AB$ definert, og hvilket format får det?", back: "Når antall søyler i $A$ er lik antall rader i $B$. En $m \\times n$ ganger en $n \\times p$ gir en $m \\times p$-matrise.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Formel for element $(i,j)$ i $AB$?", back: "$(AB)_{ij} = a_{i1}b_{1j} + \\cdots + a_{in}b_{nj}$: rad $i$ i $A$ ganget med søyle $j$ i $B$.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Er $AB = BA$?", back: "Ikke generelt. Matrisemultiplikasjon er ikke kommutativ.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Definisjon av inversmatrisen $A^{-1}$?", back: "Den $n \\times n$-matrisen som oppfyller $AA^{-1} = I$ og $A^{-1}A = I$.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Hvordan finner du $A^{-1}$ for hånd?", back: "Radreduser $[A \\mid I]$. Når venstre del er $I$, står $A^{-1}$ til høyre. En nullrad til venstre betyr at $A$ ikke er inverterbar.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "$(AB)^{-1} = \\;?$", back: "$B^{-1}A^{-1}$, i motsatt rekkefølge.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Fire ekvivalente påstander for en $n \\times n$-matrise $A$?", back: "$A\\mathbf x = \\mathbf b$ har entydig løsning for alle $\\mathbf b$; $A\\mathbf x = \\mathbf 0$ har bare $\\mathbf x = \\mathbf 0$; søylene er lineært uavhengige; $A$ er inverterbar.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Hvordan er den generelle løsningen av $A\\mathbf x = \\mathbf b$ bygd opp?", back: "Én løsning av $A\\mathbf x = \\mathbf b$ pluss alle løsningene av det homogene systemet $A\\mathbf x = \\mathbf 0$.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Hvordan bygger du $L$ og $U$ i $A = LU$?", back: "$U$ er trappeformen uten radbytter og skalering. $L$ har enere på diagonalen og multiplikatoren $l_{ij}$ (du trakk $l_{ij}$ ganger rad $j$ fra rad $i$) på plass $(i,j)$.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Hvordan løser du $A\\mathbf x = \\mathbf b$ når $A = LU$?", back: "Løs $L\\mathbf y = \\mathbf b$ ovenfra og ned (forover-innsetting), og så $U\\mathbf x = \\mathbf y$ nedenfra og opp (bakover-innsetting).", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "Hva er delvis pivotering, og hvorfor brukes det?", back: "Bytt opp raden med størst tallverdi i søylen før eliminasjon. Da har alle multiplikatorene tallverdi $\\le 1$, og små pivotelementer gir ikke store avrundingsfeil.", section: "Matriser, inversmatriser og LU-faktorisering" }
  - { front: "$\\det\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix} = \\;?$", back: "$ad - bc$", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Hvordan løser du opp en determinant etter en rad eller søyle?", back: "Hvert tall ganges med underdeterminanten du får ved å stryke raden og søylen, med fortegn $(-1)^{i+j}$, og leddene summeres. Velg raden eller søylen med flest nuller.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Hva gjør de tre radoperasjonene med determinanten?", back: "Radbytte skifter fortegn. Å gange en rad med $k$ ganger determinanten med $k$. Å legge et multiplum av en rad til en annen endrer ingenting.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Determinanten til en triangulær matrise?", back: "Produktet av diagonalelementene.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Hva betyr $\\det A \\neq 0$ for en $n \\times n$-matrise?", back: "$A$ er inverterbar, og $A\\mathbf x = \\mathbf b$ har nøyaktig én løsning for hver $\\mathbf b$. Er $\\det A = 0$, er det ingen eller uendelig mange løsninger.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Definisjon av egenverdi og egenvektor?", back: "$M\\mathbf x = \\lambda\\mathbf x$ med $\\mathbf x \\neq \\mathbf 0$. Da er $\\lambda$ en egenverdi og $\\mathbf x$ en egenvektor.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Hvordan finner du egenverdiene og egenvektorene?", back: "Løs $\\det(M - \\lambda I) = 0$ for $\\lambda$. For hver $\\lambda$: løs det homogene systemet $(M - \\lambda I)\\mathbf x = \\mathbf 0$ og velg en løsning $\\mathbf x \\neq \\mathbf 0$.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "$M^k\\mathbf x$ når $\\mathbf x$ er en egenvektor med egenverdi $\\lambda$?", back: "$\\lambda^k\\mathbf x$", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Når er $M$ diagonaliserbar, og hva er $P$ og $D$?", back: "Når $M$ har $n$ lineært uavhengige egenvektorer (alltid når den har $n$ forskjellige egenverdier). $P$ har egenvektorene som søyler, $D$ egenverdiene på diagonalen i samme rekkefølge.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "$M^k$ når $M = PDP^{-1}$?", back: "$M^k = PD^kP^{-1}$, der $D^k$ har $\\lambda_i^k$ på diagonalen.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Hvordan finner du tilstanden i det lange løp for $\\mathbf x_k = M^k\\mathbf x_0$?", back: "Skriv $\\mathbf x_0 = c_1\\mathbf v_1 + \\cdots + c_n\\mathbf v_n$ med egenvektorer. Da er $\\mathbf x_k = \\sum c_j\\lambda_j^k\\mathbf v_j$, og leddene med $|\\lambda_j| < 1$ går mot null.", section: "Determinanter, egenverdier og diagonalisering" }
  - { front: "Hva er en fikspunktiterasjon for $f(x) = 0$?", back: "Skriv ligningen som $x = g(x)$, velg $x_0$ og regn $x_{n+1} = g(x_n)$. Grensen, hvis den finnes og $g$ er kontinuerlig, er et fikspunkt $g(r) = r$.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Hvordan henger feilen i to påfølgende steg av en fikspunktiterasjon sammen?", back: "$x_{n+1} - r = g'(c_n)(x_n - r)$ for en $c_n$ mellom $x_n$ og $r$ (middelverdisetningen).", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Kravene for at fikspunktiterasjonen konvergerer på $I = [a,b]$?", back: "$g(x) \\in I$ for alle $x \\in I$, og $|g'(x)| \\le L < 1$ på $I$. Da finnes nøyaktig ett fikspunkt i $I$, og iterasjonen konvergerer for alle $x_0 \\in I$.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Feilestimatet for fikspunktiterasjon?", back: "$|x_n - r| \\le L^n|x_0 - r| \\le L^n(b - a)$.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Definisjon av konvergensorden $q$?", back: "$\\lim e_{n+1}/e_n^{\\,q} = C$ med $0 < C < \\infty$, der $e_n = |x_n - r|$.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Konvergensorden til fikspunktiterasjon når $g'(r) \\neq 0$? Når $g'(r) = 0$?", back: "Orden 1 med $C = |g'(r)|$. Orden 2 med $C = \\tfrac12|g''(r)|$ når $g''(r) \\neq 0$.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Newtons metode?", back: "$x_{n+1} = x_n - \\dfrac{f(x_n)}{f'(x_n)}$: nullpunktet til tangenten i $x_n$.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Hvorfor har Newtons metode orden 2?", back: "Den er fikspunktiterasjon med $g(x) = x - f/f'$, og $g'(x) = f f''/(f')^2$, så $g'(r) = 0$ fordi $f(r) = 0$.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Grensen $e_{n+1}/e_n^2$ for Newtons metode?", back: "$\\dfrac{|f''(r)|}{2|f'(r)|}$, når $f'(r) \\neq 0$ og $f''(r) \\neq 0$.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Når kan Newtons metode feile?", back: "Når $f'(x_n) = 0$ eller nesten null (tangenten er nesten vannrett), når følgen hopper fram og tilbake, eller når $x_0$ er for langt fra roten.", section: "Numerisk ligningsløsning med fikspunktiterasjon og Newtons metode" }
  - { front: "Hva er en separabel første ordens ligning, og hvordan løser du den?", back: "En ligning $p(y)\\,y' = q(x)$. Integrer: $\\int p(y)\\,dy = \\int q(x)\\,dx$, og løs for $y$.", section: "Første ordens differensialligninger" }
  - { front: "Hva må du passe på når du deler på $y$ for å separere?", back: "Konstante løsninger, for eksempel $y = 0$, kan forsvinne. Sjekk dem for seg.", section: "Første ordens differensialligninger" }
  - { front: "Standardformen til en lineær første ordens ligning?", back: "$y' + p(x)y = q(x)$, med koeffisient $1$ foran $y'$.", section: "Første ordens differensialligninger" }
  - { front: "Integrerende faktor for $y' + p(x)y = q(x)$?", back: "$\\rho = e^{\\int p(x)\\,dx}$. Da er $(\\rho y)' = \\rho q$, og $\\rho y = \\int \\rho q\\,dx + C$.", section: "Første ordens differensialligninger" }
  - { front: "Hvorfor virker den integrerende faktoren?", back: "Produktregelen gir $(\\rho y)' = \\rho y' + \\rho' y$, og med $\\rho' = p\\rho$ er dette $\\rho(y' + py)$.", section: "Første ordens differensialligninger" }
  - { front: "Hva er et initialverdiproblem?", back: "En differensialligning med et initialkrav som $y(x_0) = y_0$, som bestemmer konstanten i den generelle løsningen.", section: "Første ordens differensialligninger" }
  - { front: "Hvordan setter du opp ligningen for en blandetank?", back: "$y' = $ (stoff inn per tid) $-$ (stoff ut per tid). Ut $=$ konsentrasjonen $y/V$ ganger strømningsraten ut.", section: "Første ordens differensialligninger" }
  - { front: "Den logistiske ligningen og løsningen?", back: "$y' = ky(1 - y/K)$ med løsning $y = \\dfrac{K}{1 + Ce^{-kt}}$, $C = (K - y_0)/y_0$.", section: "Første ordens differensialligninger" }
  - { front: "Hvilken delbrøkoppspalting trenger du for den logistiske ligningen?", back: "$\\dfrac{K}{y(K - y)} = \\dfrac1y + \\dfrac{1}{K - y}$.", section: "Første ordens differensialligninger" }
  - { front: "Hva skjer med en logistisk løsning når $t \\to \\infty$?", back: "Den går mot bærekapasiteten $K$ (når $y_0 > 0$).", section: "Første ordens differensialligninger" }
  - { front: "$(a + bi)(c + di) = \\;?$", back: "$(ac - bd) + (ad + bc)i$", section: "Komplekse tall" }
  - { front: "Hvordan dividerer du to komplekse tall?", back: "Gang teller og nevner med den konjugerte av nevneren. Da blir nevneren $a^2 + b^2$, som er reell.", section: "Komplekse tall" }
  - { front: "$z\\bar z = \\;?$", back: "$a^2 + b^2 = |z|^2$", section: "Komplekse tall" }
  - { front: "Hvordan finner du argumentet $\\theta$ til $z = a + bi$?", back: "Fra $\\cos\\theta = a/r$ og $\\sin\\theta = b/r$ med $r = |z|$. Begge må stemme; $\\tan\\theta = b/a$ alene holder ikke.", section: "Komplekse tall" }
  - { front: "Eulers formel?", back: "$e^{i\\theta} = \\cos\\theta + i\\sin\\theta$", section: "Komplekse tall" }
  - { front: "$e^{i\\pi/2}$, $e^{i\\pi}$ og $e^{2\\pi i}$?", back: "$i$, $-1$ og $1$.", section: "Komplekse tall" }
  - { front: "Produkt og potens på polar form?", back: "$re^{i\\theta} \\cdot se^{i\\varphi} = rs\\,e^{i(\\theta + \\varphi)}$ og $(re^{i\\theta})^n = r^ne^{in\\theta}$.", section: "Komplekse tall" }
  - { front: "$e^{a + bi} = \\;?$", back: "$e^a(\\cos b + i\\sin b)$", section: "Komplekse tall" }
  - { front: "Alle løsningene av $z^n = se^{i\\varphi}$?", back: "$z_k = \\sqrt[n]{s}\\,e^{i(\\varphi + 2\\pi k)/n}$ for $k = 0, 1, \\dots, n - 1$: $n$ punkter jevnt fordelt på sirkelen med radius $\\sqrt[n]{s}$.", section: "Komplekse tall" }
  - { front: "Algebraens fundamentalteorem?", back: "Et polynom av grad $n \\ge 1$ har nøyaktig $n$ komplekse røtter regnet med multiplisitet, og $p(z) = a_n(z - z_1)\\cdots(z - z_n)$.", section: "Komplekse tall" }
  - { front: "Hva gjelder for røttene når koeffisientene er reelle?", back: "Ikke-reelle røtter kommer i konjugerte par $z$, $\\bar z$. Odde grad gir minst én reell rot.", section: "Komplekse tall" }
  - { front: "Den karakteristiske ligningen til $ay'' + by' + cy = 0$?", back: "$ar^2 + br + c = 0$, fra innsetting av $y = e^{rx}$.", section: "Andre ordens lineære differensialligninger" }
  - { front: "Generell løsning med to reelle røtter $r_1 \\neq r_2$?", back: "$y = Ae^{r_1x} + Be^{r_2x}$", section: "Andre ordens lineære differensialligninger" }
  - { front: "Generell løsning med dobbel rot $r$?", back: "$y = (A + Bx)e^{rx}$", section: "Andre ordens lineære differensialligninger" }
  - { front: "Generell løsning med komplekse røtter $\\alpha \\pm \\beta i$?", back: "$y = e^{\\alpha x}(A\\cos\\beta x + B\\sin\\beta x)$", section: "Andre ordens lineære differensialligninger" }
  - { front: "Hvorfor er $e^{\\alpha x}\\cos\\beta x$ og $e^{\\alpha x}\\sin\\beta x$ løsninger?", back: "De er real- og imaginærdelen av den komplekse løsningen $e^{(\\alpha + \\beta i)x}$, og med reelle koeffisienter løser hver del ligningen.", section: "Andre ordens lineære differensialligninger" }
  - { front: "Generell løsning av en inhomogen ligning $ay'' + by' + cy = f(x)$?", back: "$y = y_h + y_s$: den generelle homogene løsningen pluss én spesiell løsning.", section: "Andre ordens lineære differensialligninger" }
  - { front: "Når bruker du initialkravene for en inhomogen ligning?", back: "Til slutt, på hele $y = y_h + y_s$.", section: "Andre ordens lineære differensialligninger" }
  - { front: "Forslag til $y_s$ når $f(x)$ er et polynom av grad $m$, $e^{kx}$, eller $\\cos\\omega x$?", back: "Polynom av grad $m$; $Ce^{kx}$; $C\\cos\\omega x + D\\sin\\omega x$.", section: "Andre ordens lineære differensialligninger" }
  - { front: "Hva gjør du når forslaget til $y_s$ løser den homogene ligningen?", back: "Gang forslaget med $x$. Er det fortsatt en homogen løsning (dobbel rot), gang med $x^2$.", section: "Andre ordens lineære differensialligninger" }
  - { front: "Forslag til $y_s$ for $y'' + y = \\cos x$?", back: "$Ax\\cos x + Bx\\sin x$, fordi $\\cos x$ og $\\sin x$ løser $y'' + y = 0$.", section: "Andre ordens lineære differensialligninger" }
  - { front: "Eksistens- og entydighetsteoremet for $y' = f(y)$, $y(t_0) = y_0$?", back: "Er $|f'(y)| \\le L$ for alle $y$ og $L(T - t_0) < 1$, finnes nøyaktig én løsning på $[t_0, T]$.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Et initialverdiproblem med to løsninger?", back: "$y' = 2\\sqrt y$, $y(0) = 0$: både $y = 0$ og $y = t^2$. Her er $f'(y) = 1/\\sqrt y$ ubegrenset nær $0$.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Hva viser retningsfeltet til $y' = F(t, y)$?", back: "Stigningstallet $F(t, y)$ en løsning har i hvert punkt $(t, y)$. Løsningskurvene følger strekene.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Eulers eksplisitte metode?", back: "$y_{n+1} = y_n + h\\,F(t_n, y_n)$, $t_{n+1} = t_n + h$, med $h = (t_{\\text{end}} - t_0)/N$.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Eulers implisitte metode?", back: "$y_{n+1} = y_n + h\\,F(t_{n+1}, y_{n+1})$. Den ukjente står på begge sider.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Hvor kommer Eulers eksplisitte metode fra?", back: "Taylors teorem: $y(t_{n+1}) = y(t_n) + hy'(t_n) + \\tfrac12 h^2 y''(c_n)$. Stryk restleddet og bruk $y'(t_n) = F(t_n, y_n)$.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Lokal og global feil for Eulers eksplisitte metode?", back: "Lokal feil $\\tfrac12 h^2|y''(c_n)| \\le Ch^2$; global feil av størrelse $Ch$. Metoden har orden 1.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Eksplisitt Euler på $y' = -100y$ med $h = 0{,}05$?", back: "$y_{n+1} = (1 - 100h)y_n = -4y_n$: følgen eksploderer. Krever $h < 0{,}02$.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Implisitt Euler på $y' = -\\lambda y$, $\\lambda > 0$?", back: "$y_{n+1} = y_n/(1 + \\lambda h)$, som synker mot null for alle $h > 0$: stabil.", section: "Eksistens, entydighet og Eulers metoder" }
  - { front: "Hvordan kjenner du igjen Eulers eksplisitte metode i Python?", back: "En løkke med y[i+1] = y[i] + h*F(t[i], y[i]); funksjonen ganget med h er høyresiden $F$ i $y' = F(t, y)$.", section: "Eksistens, entydighet og Eulers metoder" }
  # <<< AGENT A
  # >>> AGENT B
  - { front: "Definisjonen av $\\lim_{n\\to\\infty} a_n = L$", back: "For hver $\\varepsilon > 0$ finnes en $N$ slik at $|a_n - L| < \\varepsilon$ for alle $n > N$.", section: "Følger" }
  - { front: "Når divergerer en følge?", back: "Når den ikke konvergerer mot noe tall. Eksempler: $(-1)^n$ (hopper) og $2^n$ (ubegrenset).", section: "Følger" }
  - { front: "Hva er $\\sup M$ og $\\inf M$?", back: "Den minste øvre skranken og den største nedre skranken til $M$. For $M = (0,1)$ er $\\sup M = 1$ og $\\inf M = 0$, og ingen av dem ligger i $M$.", section: "Følger" }
  - { front: "Kompletthetsegenskapen", back: "Hver ikke-tom mengde av reelle tall som er begrenset oppover, har et supremum i $\\mathbb R$.", section: "Følger" }
  - { front: "Gjelder kompletthetsegenskapen i $\\mathbb Q$?", back: "Nei. $\\{x \\in \\mathbb Q : x^2 < 2\\}$ er begrenset oppover, men $\\sqrt 2 \\notin \\mathbb Q$.", section: "Følger" }
  - { front: "Hvilke følger konvergerer garantert?", back: "Voksende følger som er begrenset oppover (mot supremum) og avtakende følger som er begrenset nedover (mot infimum).", section: "Følger" }
  - { front: "Hvordan finner du grensen til $x_{n+1} = g(x_n)$?", back: "Vis først at grensen finnes. Hvis $g$ er kontinuerlig, er grensen et fikspunkt: løs $L = g(L)$ og velg løsningen som passer med skrankene.", section: "Følger" }
  - { front: "Hvordan viser du at $a_n \\le 2$ for alle $n$ når $a_{n+1} = g(a_n)$?", back: "Med induksjon: sjekk $a_0$, anta $a_k \\le 2$ og vis $a_{k+1} = g(a_k) \\le 2$, for eksempel ved at $g$ er voksende og $g(2) \\le 2$.", section: "Følger" }
  - { front: "Er en begrenset følge alltid konvergent?", back: "Nei. $(-1)^n$ er begrenset og divergerer. Du trenger også monotoni.", section: "Følger" }
  - { front: "Definisjonen av at $f$ er kontinuerlig i $a$ (ε-δ)", back: "For hver $\\varepsilon > 0$ finnes $\\delta > 0$ slik at $|f(x) - f(a)| < \\varepsilon$ for alle $x$ med $|x - a| < \\delta$.", section: "Kontinuitet" }
  - { front: "Når eksisterer $\\lim_{x\\to a} f(x)$?", back: "Når begge de ensidige grensene eksisterer og er like. Verdien $f(a)$ spiller ingen rolle.", section: "Kontinuitet" }
  - { front: "Hvordan viser du at en grense ikke eksisterer?", back: "Finn to følger $x_n \\to a$ og $y_n \\to a$ der $f(x_n)$ og $f(y_n)$ har ulike grenser, eller vis at de ensidige grensene er ulike.", section: "Kontinuitet" }
  - { front: "$\\lim_{x\\to 0} \\frac{\\sin x}{x}$", back: "$1$, med skviseteoremet fra $\\cos x \\le \\frac{\\sin x}{x} \\le 1$.", section: "Kontinuitet" }
  - { front: "Ekstremalverdisetningen", back: "Er $f$ kontinuerlig på $[a, b]$, har $f$ en største og en minste verdi på $[a, b]$.", section: "Kontinuitet" }
  - { front: "Skjæringssetningen", back: "Er $f$ kontinuerlig på $[a, b]$ og $f(a)f(b) < 0$, finnes minst én $c \\in (a, b)$ med $f(c) = 0$.", section: "Kontinuitet" }
  - { front: "Hvorfor holder det ikke at $f$ er kontinuerlig på $(a,b)$ i ekstremalverdisetningen?", back: "$1/x$ er kontinuerlig på $(0, 1]$, men har ingen største verdi. Intervallet må være lukket og begrenset.", section: "Kontinuitet" }
  - { front: "Når har $f$ en invers?", back: "Når $f$ er injektiv, for eksempel strengt monoton. Da er $D_{f^{-1}} = V_f$ og $V_{f^{-1}} = D_f$.", section: "Kontinuitet" }
  - { front: "Verdimengden til $\\arcsin$, $\\arccos$ og $\\arctan$", back: "$[-\\pi/2, \\pi/2]$, $[0, \\pi]$ og $(-\\pi/2, \\pi/2)$.", section: "Kontinuitet" }
  - { front: "Er $f$ kontinuerlig i et punkt der grafen har en knekk?", back: "Ja, så lenge $\\lim_{x\\to a} f(x) = f(a)$. En knekk betyr at $f$ ikke er deriverbar der.", section: "Kontinuitet" }
  - { front: "Definisjonen av $f'(x)$", back: "$f'(x) = \\lim_{h\\to0} \\frac{f(x+h) - f(x)}{h}$, hvis grensen eksisterer.", section: "Derivasjon" }
  - { front: "Gir kontinuerlig deriverbar?", back: "Nei. $|x|$ er kontinuerlig i $0$, men $|h|/h$ har ensidige grenser $\\pm1$. Deriverbar gir derimot kontinuerlig.", section: "Derivasjon" }
  - { front: "Er $x\\cos(1/x)$ (med $f(0) = 0$) deriverbar i $0$?", back: "Nei. Differenskvotienten er $\\cos(1/h)$, som ikke har noen grense når $h \\to 0$.", section: "Derivasjon" }
  - { front: "Er $x^2\\cos(1/x)$ (med $f(0) = 0$) deriverbar i $0$?", back: "Ja. Differenskvotienten er $h\\cos(1/h) \\to 0$ ved skviseteoremet, så $f'(0) = 0$.", section: "Derivasjon" }
  - { front: "Den deriverte av en invers funksjon", back: "$(f^{-1})'(f(x)) = \\dfrac{1}{f'(x)}$ når $f'(x) \\ne 0$.", section: "Derivasjon" }
  - { front: "$(\\arctan x)'$ og $(\\arcsin x)'$", back: "$\\dfrac{1}{1 + x^2}$ og $\\dfrac{1}{\\sqrt{1 - x^2}}$.", section: "Derivasjon" }
  - { front: "Lineær tilnærming til $f$ i $x_0$", back: "$L(x) = f(x_0) + f'(x_0)(x - x_0)$.", section: "Derivasjon" }
  - { front: "Middelverdisetningen", back: "$f$ kontinuerlig på $[a,b]$ og deriverbar på $(a,b)$ gir en $c \\in (a,b)$ med $f'(c) = \\frac{f(b) - f(a)}{b - a}$.", section: "Derivasjon" }
  - { front: "Hva gir $f'(x) > 0$ på et intervall, og hvorfor?", back: "$f$ er strengt voksende der. Middelverdisetningen gir $f(x_2) - f(x_1) = f'(c)(x_2 - x_1) > 0$ for $x_1 < x_2$.", section: "Derivasjon" }
  - { front: "Fremover-, bakover- og sentraldifferanse", back: "$\\frac{f(x+h) - f(x)}{h}$, $\\frac{f(x) - f(x-h)}{h}$ og $\\frac{f(x+h) - f(x-h)}{2h}$. Sentraldifferansen er mest nøyaktig.", section: "Derivasjon" }
  - { front: "Hvor kan et lokalt ekstremalpunkt ligge?", back: "I kritiske punkter ($f' = 0$), singulære punkter ($f'$ finnes ikke) og endepunkter.", section: "Funksjonsdrøfting" }
  - { front: "Er $f'(c) = 0$ nok til at $c$ er et ekstremalpunkt?", back: "Nei. $x^3$ har $f'(0) = 0$, men er strengt voksende.", section: "Funksjonsdrøfting" }
  - { front: "Hvordan finner du største og minste verdi av $f$ på $[a, b]$?", back: "Ekstremalverdisetningen sier at de finnes. Regn ut $f$ i kritiske punkter, singulære punkter og endepunkter, og sammenlign.", section: "Funksjonsdrøfting" }
  - { front: "Andrederivert-testen", back: "$f'(c) = 0$ og $f''(c) > 0$ gir lokalt minimum, $f''(c) < 0$ gir lokalt maksimum. $f''(c) = 0$ gir ingen konklusjon.", section: "Funksjonsdrøfting" }
  - { front: "Konveks og konkav", back: "Konveks: grafen under sekantene, $f'' \\ge 0$. Konkav: grafen over sekantene, $f'' \\le 0$.", section: "Funksjonsdrøfting" }
  - { front: "Hvorfor skiller to antideriverte seg med en konstant?", back: "$(F - G)' = 0$ på intervallet, og middelverdisetningen gir at $F - G$ er konstant.", section: "Funksjonsdrøfting" }
  - { front: "$\\int \\frac{1}{1 + x^2}\\,dx$ og $\\int \\frac1x\\,dx$", back: "$\\arctan x + C$ og $\\ln|x| + C$.", section: "Funksjonsdrøfting" }
  - { front: "Implisitt derivasjon: hva er $\\frac{d}{dx}\\, y^3$?", back: "$3y^2 y'$, med kjerneregelen, fordi $y = y(x)$.", section: "Funksjonsdrøfting" }
  - { front: "Framgangsmåte for koblede hastigheter", back: "Skriv ligningen som binder størrelsene, deriver med hensyn på $t$, sett så inn verdiene i øyeblikket og løs for den ukjente raten.", section: "Funksjonsdrøfting" }
  - { front: "Hva er en Riemannsum?", back: "$\\sum_{i=1}^n f(x_i^*)\\,\\Delta x_i$ for en partisjon av $[a,b]$ og et punkt $x_i^*$ i hvert delintervall.", section: "Det bestemte integralet" }
  - { front: "Venstre og høyre endepunktsum med $h = \\frac{b-a}{n}$", back: "$h\\sum_{i=0}^{n-1} f(x_i)$ og $h\\sum_{i=1}^{n} f(x_i)$, med $x_i = a + ih$.", section: "Det bestemte integralet" }
  - { front: "Hvordan regner du ut $\\lim_{n\\to\\infty}\\frac1n\\sum_{i=0}^{n-1} F\\!\\left(\\frac in\\right)$?", back: "Det er en Riemannsum for $F$ på $[0,1]$, så grensen er $\\int_0^1 F(x)\\,dx$.", section: "Det bestemte integralet" }
  - { front: "Middelverdisetningen for integraler", back: "$f$ kontinuerlig på $[a,b]$ gir en $c \\in [a,b]$ med $\\int_a^b f(x)\\,dx = f(c)(b-a)$.", section: "Det bestemte integralet" }
  - { front: "Analysens fundamentalteorem", back: "1: $F(x) = \\int_a^x f(t)\\,dt$ har $F' = f$. 2: $\\int_a^b f = G(b) - G(a)$ for en antiderivert $G$.", section: "Det bestemte integralet" }
  - { front: "$\\frac{d}{dx}\\int_a^{g(x)} f(t)\\,dt$", back: "$f(g(x))\\,g'(x)$.", section: "Det bestemte integralet" }
  - { front: "Areal mellom $f$ og $g$ på $[a,b]$", back: "$\\int_a^b |f - g|\\,dx$. Finn skjæringspunktene og del opp integralet der kurvene bytter plass.", section: "Det bestemte integralet" }
  - { front: "Midtpunktmetoden", back: "$M_n = h\\sum_{i=0}^{n-1} f\\!\\left(\\frac{x_i + x_{i+1}}{2}\\right)$ med $h = \\frac{b-a}{n}$.", section: "Det bestemte integralet" }
  - { front: "Trapesmetoden", back: "$T_n = \\frac h2\\left(f(x_0) + 2\\sum_{i=1}^{n-1} f(x_i) + f(x_n)\\right)$ med $h = \\frac{b-a}{n}$.", section: "Det bestemte integralet" }
  - { front: "$\\int_{-a}^a f(x)\\,dx$ for odde og like $f$", back: "Odde: $0$. Like: $2\\int_0^a f(x)\\,dx$.", section: "Det bestemte integralet" }
  - { front: "Hvilken derivasjonsregel ligger bak substitusjon?", back: "Kjerneregelen: $\\int g(u(x))\\,u'(x)\\,dx = \\int g(u)\\,du$.", section: "Integrasjonsteknikker" }
  - { front: "Hva gjør du med grensene ved substitusjon i et bestemt integral?", back: "Bytter dem: $x = a$ blir $u = u(a)$ og $x = b$ blir $u = u(b)$. Da trenger du ikke gå tilbake til $x$.", section: "Integrasjonsteknikker" }
  - { front: "Delvis integrasjon", back: "$\\int f'g\\,dx = fg - \\int fg'\\,dx$. Produktregelen baklengs.", section: "Integrasjonsteknikker" }
  - { front: "$\\int \\ln x\\,dx$", back: "$x\\ln x - x + C$, med delvis integrasjon på $1 \\cdot \\ln x$.", section: "Integrasjonsteknikker" }
  - { front: "Delbrøker for $(x-a)$, $(x-a)^2$ og $x^2 + px + q$", back: "$\\frac{A}{x-a}$, $\\frac{A}{x-a} + \\frac{B}{(x-a)^2}$ og $\\frac{Bx + C}{x^2 + px + q}$.", section: "Integrasjonsteknikker" }
  - { front: "Hva gjør du først hvis graden til telleren er minst like stor som graden til nevneren?", back: "Polynomdivisjon, så brøken blir ekte.", section: "Integrasjonsteknikker" }
  - { front: "Når konvergerer $\\int_1^\\infty x^{-p}\\,dx$ og $\\int_0^1 x^{-p}\\,dx$?", back: "Det første for $p > 1$ (verdi $\\frac{1}{p-1}$), det andre for $p < 1$ (verdi $\\frac{1}{1-p}$).", section: "Integrasjonsteknikker" }
  - { front: "Sammenligningstesten for uegentlige integraler", back: "Er $0 \\le f \\le g$: $\\int g$ konvergerer gir $\\int f$ konvergerer, og $\\int f$ divergerer gir $\\int g$ divergerer.", section: "Integrasjonsteknikker" }
  - { front: "Hva gjør du når integranden er ubegrenset i et indre punkt $c$?", back: "Deler integralet i $c$. Hele integralet konvergerer bare hvis begge delene konvergerer.", section: "Integrasjonsteknikker" }
  - { front: "Tverrsnittmetoden", back: "$V = \\int_a^b A(x)\\,dx$, der $A(x)$ er tverrsnittarealet vinkelrett på aksen.", section: "Anvendelser av integralet" }
  - { front: "Volum når $f \\ge 0$ dreies om $x$-aksen", back: "$V = \\pi\\int_a^b f(x)^2\\,dx$. Med hull: $\\pi\\int_a^b (R^2 - r^2)\\,dx$.", section: "Anvendelser av integralet" }
  - { front: "Hvordan finner du volumet ved dreiing om $y$-aksen med skiver?", back: "Skivene står vinkelrett på $y$-aksen: skriv radien som funksjon av $y$ og integrer $\\pi\\int r(y)^2\\,dy$ over $y$.", section: "Anvendelser av integralet" }
  - { front: "Hva er radien ved dreiing om linja $y = c$?", back: "Avstanden $|f(x) - c|$ fra grafen til linja.", section: "Anvendelser av integralet" }
  - { front: "Buelengde for $y = f(x)$, $a \\le x \\le b$", back: "$L = \\int_a^b \\sqrt{1 + f'(x)^2}\\,dx$.", section: "Anvendelser av integralet" }
  - { front: "Hvor kommer $\\sqrt{1 + f'(x)^2}$ i buelengdeformelen fra?", back: "Pytagoras på et lite linjestykke, $\\sqrt{\\Delta x^2 + \\Delta y^2}$, og middelverdisetningen som gir $\\Delta y / \\Delta x = f'(c)$.", section: "Anvendelser av integralet" }
  - { front: "Overflateareal når grafen til $f$ dreies om $x$-aksen", back: "$S = 2\\pi\\int_a^b |f(x)|\\sqrt{1 + f'(x)^2}\\,dx$.", section: "Anvendelser av integralet" }
  - { front: "Volum av vann i en halvkule med radius $R$ til høyden $x$", back: "Snittareal $\\pi(2Rx - x^2)$, så $V = \\pi\\left(Rx^2 - \\frac{x^3}{3}\\right)$.", section: "Anvendelser av integralet" }
  - { front: "Taylorpolynomet $T_n$ til $f$ om $a$", back: "$T_n(x) = \\sum_{k=0}^n \\frac{f^{(k)}(a)}{k!}(x - a)^k$.", section: "Taylors teorem og feilanalyse" }
  - { front: "Restleddet i Taylors teorem", back: "$R_n(x) = \\frac{f^{(n+1)}(c)}{(n+1)!}(x - a)^{n+1}$ for en $c$ mellom $a$ og $x$.", section: "Taylors teorem og feilanalyse" }
  - { front: "Feilskranke fra restleddet", back: "$|R_n(x)| \\le \\frac{M}{(n+1)!}|x - a|^{n+1}$ når $|f^{(n+1)}| \\le M$ mellom $a$ og $x$.", section: "Taylors teorem og feilanalyse" }
  - { front: "Taylorpolynomene til $e^x$, $\\sin x$ og $\\cos x$ om $0$", back: "$1 + x + \\frac{x^2}{2!} + \\dots$, $x - \\frac{x^3}{3!} + \\frac{x^5}{5!} - \\dots$ og $1 - \\frac{x^2}{2!} + \\frac{x^4}{4!} - \\dots$.", section: "Taylors teorem og feilanalyse" }
  - { front: "$\\lim_{x\\to0}\\frac{1 - \\cos x}{x^2}$ med Taylor", back: "$\\cos x = 1 - \\frac{x^2}{2} + \\frac{\\cos c}{24}x^4$, så grensen er $\\frac12$.", section: "Taylors teorem og feilanalyse" }
  - { front: "Feilen i fremoverdifferansen", back: "$\\frac h2|f''(c)|$, altså proporsjonal med $h$.", section: "Taylors teorem og feilanalyse" }
  - { front: "Feilen i sentraldifferansen", back: "$\\frac{h^2}{12}|f'''(c_1) + f'''(c_2)| \\le \\frac{Mh^2}{6}$, altså proporsjonal med $h^2$.", section: "Taylors teorem og feilanalyse" }
  - { front: "Framgangsmåte for feilen i en differensformel", back: "Taylorutvikle hvert ledd om $x_0$, sett inn, kontroller at leddene foran restleddet gir den deriverte, og begrens restleddene med den største av dem.", section: "Taylors teorem og feilanalyse" }
  - { front: "Feilskranke for midtpunktmetoden", back: "$\\frac{(b-a)^3K}{24n^2}$ med $|f''| \\le K$ på $[a,b]$.", section: "Taylors teorem og feilanalyse" }
  - { front: "Feilskranke for trapesmetoden", back: "$\\frac{(b-a)^3K}{12n^2}$ med $|f''| \\le K$ på $[a,b]$.", section: "Taylors teorem og feilanalyse" }
  - { front: "Hva skjer med feilen i trapesmetoden når $n$ dobles?", back: "Den blir omtrent en firedel, fordi skranken er proporsjonal med $1/n^2$.", section: "Taylors teorem og feilanalyse" }
  - { front: "For hvilke funksjoner er trapes- og midtpunktmetoden eksakte?", back: "For polynomer av grad høyst $1$, der $f'' = 0$.", section: "Taylors teorem og feilanalyse" }
